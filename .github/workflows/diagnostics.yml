name: Market-feed diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/diagnose.py', 'pipeline/calendar.py', 'config/exchange_calendar_overrides.json', 'requirements.txt', '.github/workflows/diagnostics.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pipeline.diagnose
