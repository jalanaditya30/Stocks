name: Five-year historical evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/backtest.py', 'research/PROTOCOL.md', '.github/workflows/backtest.yml']
permissions:
  contents: write
concurrency:
  group: stocks-five-year-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/cache@v4
        with:
          path: tmp/backtest-prices
          key: historical-inputs-v1-${{ github.run_id }}
          restore-keys: historical-inputs-v1-
      - name: Replay five years and evaluate untouched holdout
        run: python -m pipeline.backtest --cached
      - name: Save research report
        run: |
          git config user.name "stocks-research-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/backtest/
          git diff --cached --quiet && exit 0
          git commit -m "Publish five-year historical evaluation and audit records"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            git push origin HEAD:main && exit 0
            sleep "$((attempt * 3))"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-inputs-and-results
          path: |
            tmp/backtest-prices/
            data/backtest/
          retention-days: 90
