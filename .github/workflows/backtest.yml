name: Five-year historical evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/backtest.py', 'pipeline/engine.py', 'pipeline/ranking.py', 'pipeline/calendar.py', 'config/model.json', 'config/universe.csv', 'config/exchange_calendar_overrides.json', 'requirements.txt', 'research/PROTOCOL.md', '.github/workflows/backtest.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: stocks-five-year-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/cache/restore@v4
        with:
          path: tmp/backtest-prices
          key: historical-inputs-v1-${{ github.run_id }}
          restore-keys: historical-inputs-v1-
      - name: Recover frozen inputs from the initial diagnostic run
        if: github.run_number == 2
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35387013337
          name: historical-inputs-and-results
          path: .
      - name: Replay five years and evaluate untouched holdout
        run: python -m pipeline.backtest --cached
      - name: Save research report
        run: |
          git config user.name "stocks-research-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/backtest/
          git diff --cached --quiet && exit 0
          git commit -m "Publish five-year historical evaluation and audit records"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            git push origin HEAD:main && exit 0
            sleep "$((attempt * 3))"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-inputs-and-results
          path: |
            tmp/backtest-prices/
            data/backtest/
          retention-days: 90
      - uses: actions/cache/save@v4
        if: always() && hashFiles('tmp/backtest-prices/requested.json') != ''
        with:
          path: tmp/backtest-prices
          key: historical-inputs-v1-${{ github.run_id }}
